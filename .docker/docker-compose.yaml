services:
  skateboard-postgres:
    image: postgres:16
    container_name: skateboard-postgres
    environment:
      POSTGRES_DB: skateboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  skateboard-keycloak-postgres:
    image: postgres:17
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  # Authentication service. Dev-mode with an embedded file DB — wiping the
  # container re-imports ./keycloak/realm-export.json, so local setup stays
  # reproducible. Port 8180 because 8080 is the app and 8081 is Expo/Metro.
  skateboard-keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: skateboard-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      KC_DB: postgres

      # Docker service name, NOT localhost and NOT "postgres"
      KC_DB_URL_HOST: keycloak-postgres

      # PostgreSQL internal container port
      KC_DB_URL_PORT: 5432

      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    ports:
      - "8180:8080"
    depends_on:
      - skateboard-keycloak-postgres
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes/skateboard:/opt/keycloak/themes/skateboard:ro

  # Cache backend for the podcast endpoints (spring.cache.type=redis).
  # No volume — cache data is disposable.
  skateboard-redis:
    image: redis:7-alpine
    container_name: skateboard-redis
    ports:
      - "6379:6379"

volumes:
  minio_data:
  keycloak_data:
  postgres_data:
  keycloak_postgres_data:
