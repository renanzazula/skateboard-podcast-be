server:
  port: 8080

spring:
  application:
    name: podcast

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/skateboard}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: skateboard_podcast

  flyway:
    enabled: true
    schemas: skateboard_podcast
    create-schemas: true

  cache:
    type: redis
    redis:
      time-to-live: 24h  # picked up by CacheConfig's RedisCacheManagerBuilderCustomizer

  data:
    redis:
      # Private-network URL (REDISHOST resolves to RAILWAY_PRIVATE_DOMAIN) —
      # no public TCP proxy hop needed since Redis and this service run in
      # the same Railway project.
      url: ${REDIS_URL}
      repositories:
        enabled: false

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    # Needed for RabbitDomainEventPublisher's waitForConfirms. Without confirms
    # a send the broker never accepted still looks successful, and the post
    # would be marked notified for an event nobody received.
    publisher-confirm-type: simple

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm issuer — JWKS is discovered from
          # {issuer-uri}/.well-known/openid-configuration at startup, so
          # Keycloak must be reachable when this app boots.
          issuer-uri: ${APP_SECURITY_OAUTH2_ISSUER_URI:http://localhost:8180/realms/skateboard-podcast}

app:
  security:
    oauth2:
      # Tokens must include this in their "aud" claim (see the FE client's
      # "audience" protocol mapper in .docker/keycloak/realm-export.json).
      audience: ${APP_SECURITY_OAUTH2_AUDIENCE:skateboard-podcast-be}

youtube:
  api:
    base-url: https://www.googleapis.com/youtube/v3
    # Never logged, never returned in a response — see YoutubeClient.
    key: ${YOUTUBE_API_KEY:}
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
  channel-id: ${YOUTUBE_CHANNEL_ID:}
  default-playlist-id: ${YOUTUBE_DEFAULT_PLAYLIST_ID:}
  sync:
    enabled: ${YOUTUBE_SYNC_ENABLED:false}
    cron: ${YOUTUBE_SYNC_CRON:0 */10 * * * *}
    initial-import-limit: ${YOUTUBE_SYNC_IMPORT_LIMIT:20}

spotify:
  api:
    base-url: https://api.spotify.com
    token-url: https://accounts.spotify.com/api/token
    client-id: ${SPOTIFY_CLIENT_ID:}
    # Never logged, never returned in a response — see SpotifyTokenClient.
    client-secret: ${SPOTIFY_CLIENT_SECRET:}
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
  show-id: ${SPOTIFY_SHOW_ID:}
  market: ${SPOTIFY_MARKET:}
  sync:
    # Rides along on youtube.sync's cron cycle (PodcastService.triggerSync) —
    # this only gates whether that pass also runs the Spotify enrichment step.
    enabled: ${SPOTIFY_SYNC_ENABLED:false}

podcast:
  notifications:
    # Off by default so a deployment is silent until someone deliberately turns
    # it on — the same posture the magazine plan takes with its no-op adapter.
    enabled: ${PODCAST_NOTIFICATIONS_ENABLED:false}
    # How recent an episode's publishAt must be for it to be worth announcing.
    # This is the back-catalogue guard: the YouTube sync creates PUBLISHED posts
    # carrying each video's real publication date, so without a window the first
    # run against an existing channel would notify about every episode ever made.
    max-age-hours: ${PODCAST_NOTIFICATIONS_MAX_AGE_HOURS:48}
    # Every user shares this tenant today; this service has no other source for
    # it. Same property shape skateboard-user-be uses.
    tenant-id: ${APP_TENANCY_DEFAULT_TENANT_ID:00000000-0000-0000-0000-000000000001}
    # Recovery pass for posts saved but never announced (see
    # PendingPodcastNotificationJob). Frequent enough that a broker blip costs
    # minutes, not a release.
    cron: ${PODCAST_NOTIFICATIONS_CRON:0 */5 * * * *}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%thread] %logger{36} - %msg%n"
